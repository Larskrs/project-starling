services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     starling
      POSTGRES_PASSWORD: starling
      POSTGRES_DB:       starling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starling -d starling"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Catches every email the API sends in development — nothing leaves the
  # machine. SMTP on 1025, inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
